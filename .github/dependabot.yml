version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    # CodeQL persists state between its init/analyze/upload steps and rejects mixed Action
    # versions. Keep all of its entry points on the same release in future update PRs.
    groups:
      codeql-action:
        patterns:
          - "github/codeql-action/*"
