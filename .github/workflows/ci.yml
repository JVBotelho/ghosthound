name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@a54c7afa2cb4f0511775176b976da681329fb2e1 # stable
        with:
          components: rustfmt, clippy
      - name: Check Formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Test Oracle
        run: cargo test -p ad-secdesc-oracle

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - uses: EmbarkStudios/cargo-deny-action@3f4a4725b164c9d1a46b95273f5507119ff35b54 # v2

  audit:
    name: OSV Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@648366d214a1c6a7dc2a9121a971295b9d3e8ad6 # v1.9.0
        with:
          scan-args: |-
            --lockfile=Cargo.lock
