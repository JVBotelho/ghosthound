name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: rustfmt, clippy
      - name: Check Formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Test Oracle
        run: cargo test -p ad-secdesc-oracle

  fuzz:
    name: Fuzz
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup nightly Rust
        uses: dtolnay/rust-toolchain@4fd1da8b0805d2d2e936788875a7d65dbd677dc2 # nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      # A bounded smoke test, not a full fuzzing campaign -- catches an immediate panic/crash on
      # every push without materially slowing down CI. `cargo check`ing the harness (the previous
      # approach) only confirmed it compiled; it never actually ran the fuzzer.
      - name: Fuzz ad-secdesc
        working-directory: crates/ad-secdesc
        run: cargo +nightly fuzz run fuzz_target_1 -- -max_total_time=60
      - name: Fuzz ad-tombstone
        working-directory: crates/ad-tombstone
        run: cargo +nightly fuzz run fuzz_target_1 -- -max_total_time=60

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: EmbarkStudios/cargo-deny-action@3c6349835b2b7b196a839186cb8b78e02f7b5f25 # v2

  audit:
    name: OSV Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@9a498708959aeaef5ef730655706c5a1df1edbc2 # v2.3.8
        with:
          scan-args: |-
            --lockfile=Cargo.lock

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      # Intentionally no --workspace flag: this follows the same default-members scope as the
      # `Test` job above, so the GPL-quarantined `ad-secdesc-oracle` (see docs/adr/0003) is not
      # pulled into this build either. Its coverage is reported separately by the `Test Oracle`
      # job's own test run.
      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info --summary-only
      - name: Upload coverage report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: lcov-report
          path: lcov.info
