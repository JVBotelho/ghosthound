name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@a54c7afa2cb4f0511775176b976da681329fb2e1 # stable
        with:
          components: rustfmt, clippy
      - name: Check Formatting
        run: cargo fmt -- --check
      - name: Clippy
        run: cargo clippy --all-targets --all-features -- -D warnings
      - name: Test
        run: cargo test --all-targets --all-features
      - name: Test Oracle
        run: cargo test -p ad-secdesc-oracle
      - name: Check Fuzzers
        run: cargo check --manifest-path crates/ad-secdesc/fuzz/Cargo.toml && cargo check --manifest-path crates/ad-tombstone/fuzz/Cargo.toml

  deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - uses: EmbarkStudios/cargo-deny-action@3f4a4725b164c9d1a46b95273f5507119ff35b54 # v2

  audit:
    name: OSV Scanner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Run osv-scanner
        uses: google/osv-scanner-action/osv-scanner-action@648366d214a1c6a7dc2a9121a971295b9d3e8ad6 # v1.9.0
        with:
          scan-args: |-
            --lockfile=Cargo.lock

  coverage:
    name: Code Coverage
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v4
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@a54c7afa2cb4f0511775176b976da681329fb2e1 # stable
        with:
          components: llvm-tools-preview
      - name: Install cargo-llvm-cov
        run: cargo install cargo-llvm-cov --locked
      # Intentionally no --workspace flag: this follows the same default-members scope as the
      # `Test` job above, so the GPL-quarantined `ad-secdesc-oracle` (see docs/adr/0003) is not
      # pulled into this build either. Its coverage is reported separately by the `Test Oracle`
      # job's own test run.
      - name: Generate coverage report
        run: cargo llvm-cov --all-features --lcov --output-path lcov.info --summary-only
      - name: Upload coverage report
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: lcov-report
          path: lcov.info
