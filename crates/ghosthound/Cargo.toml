[package]
license = "MIT OR Apache-2.0"
name = "ghosthound"
version = "0.1.0"
edition = "2024"
description = "GhostHound CLI: Orchestrates AD Tombstone discovery and OpenGraph generation"
repository = "https://github.com/JVBotelho/ghosthound"

[dependencies]
ad-tombstone = { version = "0.1.0", path = "../ad-tombstone" }
bloodhound-opengraph = { version = "0.1.0", path = "../bloodhound-opengraph" }
clap = { version = "4.6.2", features = ["derive", "env"] }
ldap3 = "0.12.1"
rpassword = "7.4"
serde_json = "1.0.150"
tokio = { version = "1.52.3", features = ["rt-multi-thread", "macros"] }
