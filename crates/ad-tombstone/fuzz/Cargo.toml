[package]
name = "ad-tombstone-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

# Empty table: marks this crate as its own workspace root so `cargo fuzz`/`cargo metadata`
# invoked with cwd here (or via --manifest-path) doesn't error with "current package believes
# it's in a workspace when it's not" — the parent's `workspace.exclude` entry alone is not
# sufficient for that in-directory resolution case.
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.ad-tombstone]
path = ".."

[[bin]]
name = "fuzz_target_1"
path = "fuzz_targets/fuzz_target_1.rs"
test = false
doc = false
bench = false
